<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winchester 1866 - Full Color</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background-color: #151515; font-family: sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; }
  
  .ui-overlay {
    position: absolute; top: 20px; left: 20px; pointer-events: none;
    background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 8px;
    color: white; border-left: 4px solid #d4af37; max-width: 300px;
  }
  .ui-overlay h1 { font-size: 1.5rem; margin-bottom: 5px; color: #d4af37; }
  .ui-overlay p { font-size: 0.9rem; color: #ccc; }
</style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <h1>Winchester 1866</h1>
    <p>🖱️ Drag to Rotate<br>🖱️ Scroll to Zoom</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // 1. Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x151515); 

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 6); 

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; 
    renderer.outputEncoding = THREE.sRGBEncoding; 
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0); // Light wadha ditti hai
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const fillLight = new THREE.PointLight(0xffaa55, 1.0, 20); // Warm Light
    fillLight.position.set(-5, 5, 5);
    scene.add(fillLight);

    // 3. Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true; 
    controls.autoRotateSpeed = 1.5;

    // 4. Load Model & FORCE COLOR
    const loader = new THREE.GLTFLoader();
    
    loader.load('gun.glb', function (gltf) {
        const gunModel = gltf.scene;
        
        // Center Model
        const box = new THREE.Box3().setFromObject(gunModel);
        const center = box.getCenter(new THREE.Vector3());
        gunModel.position.sub(center); 

        // === ZABARDASTI COLOR LAGAO ===
        // Eh har ik mesh te jaa ke purana grey color hata ke naya color lagayega
        gunModel.traverse((node) => {
            if (node.isMesh) {
                node.castShadow = true;
                node.receiveShadow = true;

                // Naya Material (Wooden Brown)
                // Jekar tusi Black chahte ho taan color: 0x111111 kar do
                node.material = new THREE.MeshStandardMaterial({
                    color: 0x5c3a21, // Wooden Brown Color
                    roughness: 0.6,
                    metalness: 0.3
                });
            }
        });

        scene.add(gunModel);
    }, 
    undefined, 
    function (error) {
        console.error('Error:', error);
    });

    // 5. Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // 6. Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
