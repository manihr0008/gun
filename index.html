<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winchester 1866 — Brown Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0705; font-family: 'Segoe UI', sans-serif; }

  #canvas-container { width: 100vw; height: 100vh; display: block; }

  .ui-overlay {
    position: absolute; top: 20px; left: 20px;
    pointer-events: none;
    background: rgba(20, 12, 6, 0.6);
    backdrop-filter: blur(12px);
    padding: 18px 22px;
    border-radius: 10px;
    color: #fff;
    border-left: 4px solid #c08840;
    box-shadow: 0 8px 30px rgba(0,0,0,0.7);
    max-width: 320px;
  }
  .ui-overlay h1 {
    font-size: 1.4rem; margin-bottom: 6px;
    color: #d4a860; letter-spacing: 1px; font-weight: 600;
  }
  .ui-overlay p { font-size: 0.85rem; color: #c9b8a0; line-height: 1.5; }

  .loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #d4a860; font-size: 1.1rem;
    text-align: center; letter-spacing: 3px;
    pointer-events: none;
  }
  .loading .bar {
    width: 220px; height: 3px;
    background: rgba(255,255,255,0.08);
    margin: 12px auto 0; border-radius: 2px;
    overflow: hidden;
  }
  .loading .bar div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #c08840, #f5e0b0);
    transition: width 0.2s;
  }
  .hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
  .error-msg { color: #ff5c5c !important; font-weight: 600; }
</style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay" id="ui">
    <h1>Winchester 1866</h1>
    <p>🖱️ Drag to Rotate &nbsp;|&nbsp; 🖱️ Scroll to Zoom<br>🟤 Brown Edition — Floating</p>
  </div>

  <div class="loading" id="loader">
    LOADING
    <div class="bar"><div id="progress"></div></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    /* ============================================================
       1. SCENE
    ============================================================ */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0705);

    const camera = new THREE.PerspectiveCamera(
      42, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 1.0, 5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true, alpha: false, powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    /* ============================================================
       2. ENVIRONMENT MAP
    ============================================================ */
    function buildEnvironment() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();

      const c = document.createElement('canvas');
      c.width = 2048; c.height = 1024;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 1024);
      grad.addColorStop(0.00, '#2a1f18');
      grad.addColorStop(0.42, '#5a4230');
      grad.addColorStop(0.50, '#f8f0e0');
      grad.addColorStop(0.58, '#7a5a3a');
      grad.addColorStop(0.75, '#3a2818');
      grad.addColorStop(1.00, '#0a0705');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 2048, 1024);

      const drawStreak = (x, y, w, h, color, blur) => {
        ctx.save();
        ctx.shadowBlur = blur;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
        ctx.restore();
      };
      drawStreak(150, 320, 60, 380, '#fff8dc', 80);
      drawStreak(420, 280, 50, 460, '#ffe9a8', 100);
      drawStreak(720, 340, 70, 340, '#fff8dc', 80);
      drawStreak(1050, 300, 55, 420, '#ffe9a8', 100);
      drawStreak(1380, 330, 65, 360, '#fff8dc', 80);
      drawStreak(1700, 310, 50, 400, '#ffe9a8', 100);

      const warmGlow = (cx, cy, r, color) => {
        const rg = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
        rg.addColorStop(0, color);
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = rg;
        ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      };
      warmGlow(300, 500, 400, 'rgba(255,180,80,0.7)');
      warmGlow(1500, 480, 450, 'rgba(255,200,120,0.6)');

      const coolGlow = ctx.createRadialGradient(100, 600, 10, 100, 600, 400);
      coolGlow.addColorStop(0, 'rgba(140,170,255,0.7)');
      coolGlow.addColorStop(1, 'rgba(140,170,255,0)');
      ctx.fillStyle = coolGlow;
      ctx.fillRect(0, 200, 600, 600);

      const tex = new THREE.CanvasTexture(c);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.encoding = THREE.sRGBEncoding;

      const envMap = pmrem.fromEquirectangular(tex).texture;
      tex.dispose();
      pmrem.dispose();
      return envMap;
    }

    const envMap = buildEnvironment();
    scene.environment = envMap;

    /* ============================================================
       3. LIGHTING
    ============================================================ */
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
    keyLight.position.set(6, 10, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 40;
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -6;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xd4a860, 2.4);
    rimLight.position.set(-7, 4, -6);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0xfff0d0, 1.4, 30, 2);
    fillLight.position.set(-4, 3, 6);
    scene.add(fillLight);

    const bounce = new THREE.PointLight(0x8866ff, 1.0, 18, 2);
    bounce.position.set(0, -3, 0);
    scene.add(bounce);

    /* ============================================================
       4. CONTROLS
    ============================================================ */
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.4;
    controls.enablePan = false;
    controls.minDistance = 1.5;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * 0.85;
    controls.minPolarAngle = Math.PI * 0.15;

    controls.addEventListener('start', () => controls.autoRotate = false);
    controls.addEventListener('end', () => {
      setTimeout(() => controls.autoRotate = true, 2500);
    });

    /* ============================================================
       5. LOAD MODEL — FIRE POSITION (khada lot, barrel aage)
    ============================================================ */
    const loaderEl   = document.getElementById('loader');
    const progressEl = document.getElementById('progress');
    const uiEl       = document.getElementById('ui');

    const loader = new THREE.GLTFLoader();
    let gunGroup = null;
    let baseY = 0;

    loader.load(
      'gun.glb',

      function (gltf) {
        const gunModel = gltf.scene;

        // ---- Detect longest axis ----
        const rawBox  = new THREE.Box3().setFromObject(gunModel);
        const rawSize = rawBox.getSize(new THREE.Vector3());

        // STEP 1: Make it horizontal first (barrel along X axis)
        if (rawSize.y > rawSize.x && rawSize.y > rawSize.z) {
          gunModel.rotation.z = -Math.PI / 2;          // Y-long → X
        } else if (rawSize.z > rawSize.x && rawSize.z > rawSize.y) {
          gunModel.rotation.y = Math.PI / 2;           // Z-long → X
        }

        // STEP 2: Fire position — rotate around Y so barrel points TOWARD camera (Z-axis)
        // This puts the gun "standing/aiming" — barrel forward, khada lot
        gunModel.rotation.y += Math.PI / 2;

        // Recompute box AFTER rotations
        gunModel.updateMatrixWorld(true);
        const box    = new THREE.Box3().setFromObject(gunModel);
        const center = box.getCenter(new THREE.Vector3());
        const size   = box.getSize(new THREE.Vector3());
        gunModel.position.sub(center);

        // ---- Materials: BROWN + MAX REFLECTION ----
        gunModel.traverse((node) => {
          if (!node.isMesh) return;
          node.castShadow = true;
          node.receiveShadow = true;

          const name = (node.name + ' ' + (node.material?.name || '')).toLowerCase();
          const isWood  = /wood|stock|handle|grip/.test(name);
          const isBrass = /brass|gold|receiver|trigger|lever/.test(name);

          if (isWood) {
            node.material = new THREE.MeshStandardMaterial({
              color: 0x5c3a1e,
              metalness: 0.55,
              roughness: 0.15,
              envMap,
              envMapIntensity: 2.2
            });
          } else if (isBrass) {
            node.material = new THREE.MeshStandardMaterial({
              color: 0xc08840,
              metalness: 1.0,
              roughness: 0.03,
              envMap,
              envMapIntensity: 3.0
            });
          } else {
            node.material = new THREE.MeshStandardMaterial({
              color: 0x2b1a0f,
              metalness: 1.0,
              roughness: 0.02,
              envMap,
              envMapIntensity: 3.2
            });
          }
        });

        // Wrap in group for floating bob
        gunGroup = new THREE.Group();
        gunGroup.add(gunModel);
        scene.add(gunGroup);

        // Auto-frame camera
        const maxDim = Math.max(size.x, size.y, size.z);
        const dist   = maxDim * 1.9;
        camera.position.set(0, maxDim * 0.35, dist);
        camera.near = maxDim * 0.01;
        camera.far  = maxDim * 200;
        camera.updateProjectionMatrix();

        controls.target.set(0, 0, 0);
        controls.minDistance = maxDim * 0.6;
        controls.maxDistance = maxDim * 5;
        controls.update();

        baseY = 0;
        gunGroup.position.y = baseY;

        loaderEl.classList.add('hidden');
        setTimeout(() => loaderEl.remove(), 500);
      },

      function (xhr) {
        if (xhr.total) {
          progressEl.style.width = Math.round((xhr.loaded / xhr.total) * 100) + '%';
        }
      },

      function (error) {
        console.error('GLB load failed:', error);
        loaderEl.innerHTML = '<p class="error-msg">⚠️ Failed to load gun.glb<br><span style="font-size:0.8rem;color:#888;">File should be in same folder</span></p>';
        uiEl.querySelector('p').textContent = 'Model missing — check console.';
      }
    );

    /* ============================================================
       6. RENDER LOOP
    ============================================================ */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (gunGroup) {
        gunGroup.position.y = baseY + Math.sin(t * 1.1) * 0.06;
        gunGroup.rotation.z = Math.sin(t * 0.7) * 0.015;
      }

      rimLight.intensity = 2.4 + Math.sin(t * 1.3) * 0.35;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    /* ============================================================
       7. RESIZE
    ============================================================ */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    renderer.domElement.style.touchAction = 'none';
  </script>
</body>
</html>
