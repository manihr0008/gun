<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winchester 1866 - Black Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background-color: #2a2a2a; font-family: sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; }
  
  .ui-overlay {
    position: absolute; top: 20px; left: 20px; pointer-events: none;
    background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 8px;
    color: white; border-left: 4px solid #d4af37; max-width: 300px;
  }
  .ui-overlay h1 { font-size: 1.5rem; margin-bottom: 5px; color: #d4af37; }
  .ui-overlay p { font-size: 0.9rem; color: #ccc; }
</style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <h1>Winchester 1866</h1>
    <p>🖱️ Drag to Rotate<br>🖱️ Scroll to Zoom</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a2a2a); 

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 5); 

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; 
    renderer.outputEncoding = THREE.sRGBEncoding; 
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Lighting (Tez roshni taaki black gun dekh sake)
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); 
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const fillLight = new THREE.PointLight(0xffffff, 1.0, 20); 
    fillLight.position.set(-5, 5, 5);
    scene.add(fillLight);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true; 
    controls.autoRotateSpeed = 1.5;

    const loader = new THREE.GLTFLoader();
    
    loader.load('gun.glb', function (gltf) {
        const gunModel = gltf.scene;
        
        const box = new THREE.Box3().setFromObject(gunModel);
        const center = box.getCenter(new THREE.Vector3());
        gunModel.position.sub(center); 

        // === ZABARDASTI BLACK METAL COLOR ===
        gunModel.traverse((node) => {
            if (node.isMesh) {
                node.castShadow = true;
                node.receiveShadow = true;

                // Eh purana grey material poori tarah hata dega
                // Te naya Glossy Black Metal laga dega
                node.material = new THREE.MeshStandardMaterial({
                    color: 0x111111,   // Dark Black
                    metalness: 0.9,    // Metal wargi chamak
                    roughness: 0.2     // Thoda shiny
                });
            }
        });

        scene.add(gunModel);
    }, 
    undefined, 
    function (error) {
        console.error('Error:', error);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
