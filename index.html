<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My 3D Gun Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; }
  
  .ui-overlay {
    position: absolute; top: 20px; left: 20px; pointer-events: none;
    background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 8px;
    color: white; border-left: 4px solid #d4af37; max-width: 300px;
  }
  .ui-overlay h1 { font-size: 1.5rem; margin-bottom: 5px; color: #d4af37; }
  .ui-overlay p { font-size: 0.9rem; color: #ccc; }
  
  #loader {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #d4af37; font-size: 1.2rem; font-weight: bold; z-index: 10;
  }
</style>
</head>
<body>

  <div id="loader">Loading 3D Model...</div>
  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <h1>ASG Barra 1866 CO2</h1>
    <p>🖱️ Drag to Rotate<br>🖱️ Scroll to Zoom</p>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // 1. Setup Scene, Camera, Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a); // Dark background

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 5); // Camera distance

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; // Enable shadows
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. Lighting (Makes the metal and wood look real)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const backLight = new THREE.PointLight(0xffaa00, 0.5, 10);
    backLight.position.set(-5, 2, -5);
    scene.add(backLight);

    // 3. Controls (Mouse rotate & zoom)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true; // Gun slowly spins on load
    controls.autoRotateSpeed = 1.5;

    // 4. Load your .glb file
    const loader = new THREE.GLTFLoader();
    
    // ⚠️ IMPORTANT: Make sure your file name is exactly 'gun.glb'
    loader.load('gun.glb', function (gltf) {
        const gunModel = gltf.scene;
        
        // Auto-center and scale the model
        const box = new THREE.Box3().setFromObject(gunModel);
        const center = box.getCenter(new THREE.Vector3());
        gunModel.position.sub(center); // Center it

        gunModel.traverse((node) => {
            if (node.isMesh) {
                node.castShadow = true;
                node.receiveShadow = true;
            }
        });

        scene.add(gunModel);
        document.getElementById('loader').style.display = 'none'; // Hide loading text
    }, 
    undefined, 
    function (error) {
        console.error('Error loading model:', error);
        document.getElementById('loader').innerText = "Error: gun.glb file not found!";
    });

    // 5. Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // 6. Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
